<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Hex Head Box -->
  <rect x="10" y="20" width="80" height="30" fill="#3b3b3b" rx="2"/>
  <!-- Face indent lines -->
  <line x1="30" y1="20" x2="30" y2="50" stroke="white" stroke-width="4"/>
  <line x1="70" y1="20" x2="70" y2="50" stroke="white" stroke-width="4"/>
  <!-- Shaft -->
  <rect x="35" y="50" width="30" height="45" fill="#3b3b3b"/>
</svg>